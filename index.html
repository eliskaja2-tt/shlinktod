<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心士林</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#3a2a1a;--sub:#8a7560;--main:#ff7a3d;--ok:#2fb36b;--line:#f0dfc2;--bar:#ffe3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241b12;--card:#33271b;--ink:#fbeedb;--sub:#c2a98a;--line:#4a3a28;--bar:#4a3a28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241b12;--card:#33271b;--ink:#fbeedb;--sub:#c2a98a;--line:#4a3a28;--bar:#4a3a28;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:520px;margin:0 auto;padding:12px 12px 40px}
header{text-align:center}
h1{font-size:20px;margin:4px 0}
.top{display:flex;gap:8px;justify-content:center;font-weight:700;margin:6px 0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.tap{width:100%;font-size:20px;font-weight:800;padding:14px;border:0;border-radius:16px;background:var(--main);color:#fff;box-shadow:0 4px 0 #c9561f;margin:6px 0 12px}
.tap:active{transform:translateY(3px);box-shadow:0 1px 0 #c9561f}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:10px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:16px;font-weight:700}
.tab.on{background:var(--main);color:#fff;border-color:var(--main)}
.stall{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.head{display:flex;align-items:center;gap:10px}
.emo{font-size:34px}
.nm{font-weight:800}.sm{font-size:12px;color:var(--sub)}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button.b{padding:9px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:13px;font-weight:700}
button.b:disabled{opacity:.4}
button.b.go{background:var(--ok);color:#fff;border-color:var(--ok)}
.open{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fly{position:fixed;pointer-events:none;font-weight:800;color:var(--main);animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.tip{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}
.rail{position:relative;height:70px;background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.rail .tod{position:absolute;left:8px;top:6px;font-weight:800;font-size:13px}
.trk{position:absolute;left:0;right:0;bottom:6px;height:4px;background:repeating-linear-gradient(90deg,var(--sub) 0 8px,transparent 8px 14px)}
.stn{position:absolute;right:8px;top:2px;font-size:24px}
.train{position:absolute;right:6px;bottom:10px;font-size:26px;transform:translateX(160%);transition:transform 1.5s}
.train.in{transform:none}
.rtxt{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:12px;font-weight:700;color:var(--sub)}
.rtxt.hot{color:var(--main);font-size:14px}
.rw{position:absolute;right:44px;font-size:20px;animation:walkL 1.6s linear forwards}
@keyframes walkL{to{right:calc(100% - 76px);opacity:.3;transform:scale(.7)}}
.mi{height:1.1em;width:auto;vertical-align:middle}
.emo .mi{height:42px}.door .mi{height:30px}
.lane{position:relative;height:38px;margin:8px 0 0;background:var(--bar);border-radius:10px;overflow:hidden}
.gate{position:absolute;left:6px;top:8px;font-size:18px}
.door{position:absolute;right:6px;top:4px;font-size:24px}
.walker{position:absolute;left:30px;font-size:20px;animation:walk 1.5s linear forwards}
@keyframes walk{to{left:calc(100% - 46px);opacity:.2;transform:scale(.6)}}
.gain{position:absolute;right:38px;top:8px;font-weight:800;color:var(--ok);animation:pop .8s forwards}
@keyframes pop{to{transform:translateY(-14px);opacity:0}}
</style>
</head>

var FL=[2,3,4,5],PER={2:3,3:3,4:2,5:2};
var S={coin:60,tapLv:10,fl:2,st:[]};
for(var i=0;i<10;i++)S.st.push(null);
try{var sv=JSON.parse(localStorage.getItem("tod1"));if(sv&&sv.st)S=sv}catch(e){}
S.st=S.st.map(function(s){return s&&T[s.t]?s:null});
function save(){try{localStorage.setItem("tod1",JSON.stringify(S))}catch(e){}}
function idxOf(f){var s=0;for(var k=2;k<f;k++)s+=PER[k];return s}
function cap(s){return 10+s.cap*10}
function price(s){return T[s.t].p*(1+0.5*(s.lv-1))}
function upC(s){return Math.round(T[s.t].cost*0.6*Math.pow(1.7,s.lv-1))}
function stC(s){return 60*(s.staff+1)}
function cpC(s){return 30*(s.cap+1)}
function rsC(s){return Math.ceil((cap(s)-s.stock)*T[s.t].p*0.3)}
function stars(){var t=0;S.st.forEach(function(s){if(s)t+=s.lv+s.staff});return Math.floor(t/6)}
function $(id){return document.getElementById(id)}
function fmt(n){return Math.floor(n).toLocaleString()}
function render(){
 $("tabs").innerHTML=FL.map(function(f){return '<button class="tab'+(f==S.fl?' on':'')+'" data-f="'+f+'">'+f+'F</button>'}).join("");
 var h="",b=idxOf(S.fl);
 for(var j=0;j<PER[S.fl];j++){var i=b+j,s=S.st[i];
  if(!s){h+='<div class="stall"><div class="head"><div class="emo">🏗️</div><div><div class="nm">空攤位 '+S.fl+'F-'+(j+1)+'</div><div class="sm">選一種店來開張吧！</div></div></div><div class="open">'+
   Object.keys(T).map(function(k){return '<button class="b" data-o="'+i+'" data-k="'+k+'" data-c="'+T[k].cost+'">'+T[k].e+'<br>'+T[k].n+'<br>💰'+T[k].cost+'</button>'}).join("")+'</div></div>';
  }else{
   h+='<div class="stall"><div class="head"><div class="emo">'+T[s.t].e+'</div><div><div class="nm">'+T[s.t].names[s.nm]+'（Lv.'+s.lv+'）</div><div class="sm">店員 '+s.staff+' 人 ・ 每份 💰'+price(s).toFixed(1)+'</div></div></div>'+
   '<div class="lane" data-lane="'+i+'"><span class="gate">🚇</span><span class="door">'+T[s.t].e+'</span></div><div class="bar"><i data-bar="'+i+'"></i></div><div class="sm" data-sk="'+i+'"></div><div class="grid" style="margin-top:6px">'+
   '<button class="b" data-u="up" data-i="'+i+'" data-c="'+upC(s)+'">⭐升級店面<br>💰'+upC(s)+'</button>'+
   '<button class="b" data-u="staff" data-i="'+i+'" data-c="'+stC(s)+'"'+(s.staff>=5?' disabled':'')+'>🧑‍🍳招募店員<br>'+(s.staff>=5?'已滿':'💰'+stC(s))+'</button>'+
   '<button class="b" data-u="cap" data-i="'+i+'" data-c="'+cpC(s)+'"'+(s.cap>=5?' disabled':'')+'>📦擴充倉庫<br>'+(s.cap>=5?'已滿':'💰'+cpC(s))+'</button>'+
   '<button class="b go" data-u="re" data-i="'+i+'" data-c="'+rsC(s)+'">🛒進貨補滿<br>💰'+rsC(s)+'</button></div></div>';
  }}
 $("list").innerHTML=h;upd();
}
function upd(){
 $("coin").textContent=fmt(S.coin);$("star").textContent="⭐ "+stars();$("tv").textContent=S.tapLv;
 document.querySelectorAll("[data-c]").forEach(function(el){var d=el.hasAttribute("disabled")&&(el.textContent.indexOf("已滿")>-1);if(!d)el.disabled=S.coin<+el.dataset.c});
 S.st.forEach(function(s,i){if(!s)return;
  var bar=document.querySelector('[data-bar="'+i+'"]'),sk=document.querySelector('[data-sk="'+i+'"]');
  if(bar)bar.style.width=(s.stock/cap(s)*100)+"%";
  if(sk)sk.textContent=s.stock>=1?"📦 庫存 "+Math.floor(s.stock)+" / "+cap(s):"⚠️ 沒貨了！快進貨！"});
}
function walk(i,n,p){
 var lane=document.querySelector('[data-lane="'+i+'"]');if(!lane)return;
 var P=["🧒","👧","👦","🧑","👩","👨","🧓","🧑‍🎓"],k=Math.min(5,Math.ceil(n));
 for(var a=0;a<k;a++)(function(a){setTimeout(function(){
  var w=document.createElement("span");w.className="walker";w.textContent=P[Math.floor(Math.random()*P.length)];w.style.top=(6+Math.random()*8)+"px";lane.appendChild(w);
  setTimeout(function(){w.remove();var c=document.createElement("span");c.className="gain";c.textContent="+"+Math.round(p);lane.appendChild(c);setTimeout(function(){c.remove()},800)},1500)
 },a*250)})(a);
}
function fly(txt,x,y){var d=document.createElement("div");d.className="fly";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);setTimeout(function(){d.remove()},1000)}
document.addEventListener("click",function(e){
 var el=e.target.closest("button");if(!el)return;
 if(el.id=="tap"){S.coin+=S.tapLv;fly("+"+S.tapLv,e.clientX-8,e.clientY-30);upd();return}
 if(el.dataset.f){S.fl=+el.dataset.f;render();return}
 var c=+el.dataset.c;if(S.coin<c)return;
 if(el.dataset.o){S.coin-=c;var k=el.dataset.k;S.st[+el.dataset.o]={t:k,nm:Math.floor(Math.random()*3),lv:1,staff:0,cap:0,stock:10,acc:0}}
 else if(el.dataset.u){var s=S.st[+el.dataset.i],u=el.dataset.u;S.coin-=c;
  if(u=="up")s.lv++;else if(u=="staff")s.staff++;else if(u=="cap")s.cap++;else s.stock=cap(s)}
 else return;
 if(stars()>=0&&S.coin>=0){}
 save();render();
});
setInterval(function(){
 var any=false;
 S.st.forEach(function(s){if(!s||s.stock<1)return;
  var n=Math.min(s.stock,(1+s.staff*0.5)*(RUSH.on>0?2:1));s.stock-=n;S.coin+=n*price(s)*(s.t=="jam"&&RUSH.on>0?1.5:1);any=true;walk(S.st.indexOf(s),n,price(s))});
 if(any){save();upd()}
},1000);
var RUSH={t:20,on:0};
setInterval(function(){
 var r=$("rtxt"),tr=$("train"),rail=document.querySelector(".rail");
 if(RUSH.on>0){RUSH.on--;
  for(var a=0;a<2;a++)(function(a){setTimeout(function(){var w=document.createElement("span");w.className="rw";w.textContent=["🧒","👧","👦","🧑","👩","👨","🧓","🧑‍🎓"][Math.floor(Math.random()*8)];w.style.top=(30+Math.random()*14)+"px";rail.appendChild(w);setTimeout(function(){w.remove()},1600)},a*400)})(a);
  if(RUSH.on<7)tr.classList.remove("in");
  if(RUSH.on==0){RUSH.t=35;r.classList.remove("hot")}
  else r.textContent="🚨 尖峰人潮！收入 ×2（"+RUSH.on+" 秒）";
 }else{RUSH.t--;
  if(RUSH.t<=0){RUSH.on=10;tr.classList.add("in");r.classList.add("hot")}
  else r.textContent="🚇 下一班列車 "+RUSH.t+" 秒到站"}
},1000);
// 點擊招攬等級：每 3 星 +1
setInterval(function(){S.tapLv=10+Math.floor(stars()/3)*5},2000);
render();
</script>
